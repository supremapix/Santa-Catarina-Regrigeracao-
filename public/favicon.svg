<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#glow)"/>
  
  <!-- Outer accent ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" />

  <!-- Center Snowflake / Cold Refrigeração Emblem -->
  <g transform="translate(256,256)" fill="url(#iceGrad)" stroke="url(#iceGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Vertical Branch -->
    <line x1="0" y1="-170" x2="0" y2="170" stroke-width="28" />
    <!-- Main Horizontal Branch -->
    <line x1="-170" y1="0" x2="170" y2="0" stroke-width="28" />
    <!-- Diagonal 1 -->
    <line x1="-120" y1="-120" x2="120" y2="120" stroke-width="28" />
    <!-- Diagonal 2 -->
    <line x1="-120" y1="120" x2="120" y2="-120" stroke-width="28" />

    <!-- Branch V-ticks top -->
    <path d="M -45,-125 L 0,-170 L 45,-125" fill="none" stroke-width="26" />
    <path d="M -35,-85 L 0,-120 L 35,-85" fill="none" stroke-width="22" />

    <!-- Branch V-ticks bottom -->
    <path d="M -45,125 L 0,170 L 45,125" fill="none" stroke-width="26" />
    <path d="M -35,85 L 0,120 L 35,85" fill="none" stroke-width="22" />

    <!-- Branch V-ticks left -->
    <path d="M -125,-45 L -170,0 L -125,45" fill="none" stroke-width="26" />
    <path d="M -85,-35 L -120,0 L -85,35" fill="none" stroke-width="22" />

    <!-- Branch V-ticks right -->
    <path d="M 125,-45 L 170,0 L 125,45" fill="none" stroke-width="26" />
    <path d="M 85,-35 L 120,0 L 85,35" fill="none" stroke-width="22" />

    <!-- Center core crystal -->
    <circle cx="0" cy="0" r="38" fill="#0284c7" stroke="#ffffff" stroke-width="16" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="none" />
  </g>
</svg>
